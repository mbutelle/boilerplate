services:
    traefik:
        image: "traefik:v2.11"
        command:
            - "--log.level=DEBUG"
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.mailhog.address=:8025"
        ports:
            # Ports paramétrables : un socle dont les ports sont figés interdit de
            # faire tourner deux projets qui en sont issus en même temps.
            - "${HTTP_PORT:-80}:80"
            - "${TRAEFIK_PORT:-8080}:8080"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"

    api:
        build:
            context: ./api
            target: api-base
        # Image nommée : les futurs services qui partagent ce build (worker,
        # planificateur) la réutilisent, ce qui évite des images divergentes
        # d'un service à l'autre.
        image: boilerplate-api
        # Tourner sous l'utilisateur hôte : les fichiers écrits dans le volume
        # monté (vendor/, var/log, clés JWT…) lui appartiennent, au lieu d'être
        # en root et de nécessiter un sudo pour la moindre suppression.
        user: "${UID:-1000}:${GID:-1000}"
        # Le binaire frankenphp porte cap_net_bind_service ; la redonner ici la
        # conserve dans le jeu de capacités une fois qu'on n'est plus root, pour
        # que Caddy puisse encore écouter sur le port 80 dans le conteneur.
        cap_add:
            - NET_BIND_SERVICE
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            # Runtime FrankenPHP : c'est lui qui garde le noyau Symfony en
            # mémoire entre les requêtes. Sans cette variable, l'application
            # tourne en mode classique et le worker ne sert à rien.
            - APP_RUNTIME=Runtime\FrankenPhpSymfony\Runtime
            - REDIS_URL=redis://redis:6379
            # Caddy et Composer écrivent leur état dans des dossiers appartenant
            # à root dans l'image (/config, /data, /composer). Les rediriger vers
            # des chemins inscriptibles est ce qui permet de tourner sous un UID
            # arbitraire ; sans ça le conteneur ne démarre pas.
            - XDG_CONFIG_HOME=/tmp/caddy-config
            - XDG_DATA_HOME=/tmp/caddy-data
            - COMPOSER_HOME=/tmp/composer
        volumes:
            - ./api:/var/www/app/:rw,cached
            - ./var:/var/shared
        labels:
            # Noms de routeurs préfixés par le projet : Traefik lit le socket
            # Docker de la machine entière, donc un routeur générique nommé
            # « api » entre en collision avec celui d'un autre projet, et
            # Traefik écarte alors LES DEUX en silence (404 des deux côtés).
            - "traefik.enable=true"
            - "traefik.http.routers.boilerplate-api.rule=Host(`api.boilerplate.localhost`)"
            - "traefik.http.routers.boilerplate-api.entrypoints=web"
            - "traefik.http.services.boilerplate-api.loadbalancer.server.port=80"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost/health"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 90s

    # Consomme le transport asynchrone. Sans ce service, les messages partent
    # dans la file et personne ne les traite : aucune erreur, juste des effets
    # qui n'arrivent jamais. C'est le défaut le plus silencieux d'un socle.
    worker:
        extends:
            service: api
        image: boilerplate-api
        # Saute l'entrypoint applicatif (composer install + migrations) : ces
        # étapes sont déjà faites par le service api, et les refaire écrirait
        # dans le vendor/ partagé pendant que l'api tourne.
        entrypoint: ["docker-php-entrypoint"]
        command: php bin/console messenger:consume async --time-limit=3600 -v
        environment:
            # Runtime Symfony standard, et non celui de FrankenPHP : c'est une
            # commande console, pas un serveur HTTP.
            - APP_RUNTIME=Symfony\Component\Runtime\SymfonyRuntime
        depends_on:
            api:
                condition: service_healthy
        labels:
            - "traefik.enable=false"
        volumes:
            # var/cache en tmpfs : ses écritures ne touchent pas le bind-mount
            # surveillé par le rechargement à chaud de l'api (qui redémarrerait
            # en boucle), et un tmpfs reste inscriptible quel que soit l'UID.
            # Monté en 1777 comme /tmp : un tmpfs nu naîtrait en root:755.
            - type: tmpfs
              target: /var/www/app/var/cache
              tmpfs:
                  mode: 01777
        healthcheck:
            disable: true
        restart: unless-stopped

    # « Cron » local. En production, ce sont des unités systemd (voir deploy/) ou
    # un CronJob de l'orchestrateur, sur les mêmes commandes.
    scheduler:
        extends:
            service: api
        image: boilerplate-api
        entrypoint: ["docker-php-entrypoint"]
        command: >-
            /bin/sh -c "while true; do
              php bin/console gesdinet:jwt:clear;
              sleep ${SCHEDULER_INTERVAL:-3600};
            done"
        environment:
            - APP_RUNTIME=Symfony\Component\Runtime\SymfonyRuntime
        depends_on:
            api:
                condition: service_healthy
        labels:
            - "traefik.enable=false"
        volumes:
            - type: tmpfs
              target: /var/www/app/var/cache
              tmpfs:
                  mode: 01777
        healthcheck:
            disable: true
        restart: unless-stopped

    database:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: boilerplate
            MYSQL_USER: boilerplate
            MYSQL_PASSWORD: boilerplate
            MYSQL_ROOT_PASSWORD: boilerplate
        volumes:
            - ./mysql_storage:/var/lib/mysql:rw,delegated
            - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
        # Aucun port publié : l'api joint la base par son nom de service sur le
        # réseau compose. Pour brancher un client graphique, ajouter le mapping
        # dans docker-compose.override.yaml plutôt qu'ici — sinon chaque projet
        # dérivé du socle se dispute le 3306 de la machine.
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uboilerplate", "-pboilerplate"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    mailhog:
        # ne pas utiliser en production
        image: mailhog/mailhog:latest
        environment:
            - MH_STORAGE=maildir
        volumes:
            - ./docker/mailhog/maildir:/maildir:rw,delegated
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.boilerplate-mailhog.rule=Host(`mail.boilerplate.localhost`)"
            - "traefik.http.routers.boilerplate-mailhog.entrypoints=mailhog"

    # Installation unique des dépendances du workspace, partagée par tous les
    # fronts. Un service à part plutôt qu'un `pnpm install` dans chaque conteneur :
    # sinon plusieurs installations concurrentes écrivent dans le même
    # node_modules et se marchent dessus.
    node-install:
        build:
            context: ./docker/node
        image: boilerplate/node-dev
        user: "${UID:-1000}:${GID:-1000}"
        working_dir: /usr/src/app
        environment:
            # Sans TTY, pnpm refuse de recréer node_modules et s'arrête sur
            # ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY. CI=true est la réponse
            # documentée, et c'est bien le régime d'un service d'installation.
            - CI=true
        volumes:
            - .:/usr/src/app:rw,cached
        command: pnpm install --frozen-lockfile
        labels:
            - "traefik.enable=false"

    front:
        image: boilerplate/node-dev
        user: "${UID:-1000}:${GID:-1000}"
        depends_on:
            api:
                condition: service_started
            node-install:
                condition: service_completed_successfully
        expose:
            - 3000
        working_dir: /usr/src/app/front
        environment:
            - API_URL=http://api.boilerplate.localhost
        volumes:
            - .:/usr/src/app:rw,cached
            - ./var:/var/shared
        command: pnpm dev --host 0.0.0.0 --port 3000
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.boilerplate-front.rule=Host(`front.boilerplate.localhost`)"
            - "traefik.http.routers.boilerplate-front.entrypoints=web"
            - "traefik.http.services.boilerplate-front.loadbalancer.server.port=3000"
