packages:
  - 'front'
  - 'packages/*'

# pnpm 10+ bloque par défaut les scripts de build des dépendances. Sans cette
# liste, esbuild n'a pas de binaire, le watcher de Nuxt ne se compile pas, et le
# front démarre sur des erreurs difficiles à rattacher à leur cause.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  # rolldown est arrivé avec Nuxt 4.5 : sans son binaire natif, `nuxt typecheck`
  # échoue sur « Cannot find module '../rolldown-binding…node' », alors que
  # `nuxt build` passe. Le symptôme ne se voit donc qu'à la gate de types.
  - rolldown
  - unrs-resolver
  - vue-demi
# Une version publiée il y a moins de 7 jours n'est pas installée : un paquet
# compromis est en général retiré dans ce délai (pnpm 10.16+). Le temps est en minutes.
minimumReleaseAge: 10080
