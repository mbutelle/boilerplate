api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    mapping:
        paths:
            - '%kernel.project_dir%/src/IAM/Infrastructure/ApiPlatform/Resource'
            - '%kernel.project_dir%/src/Catalog/Infrastructure/ApiPlatform/Resource'

parameters:
    # Associe le FQCN d'un modèle de domaine au FQCN de sa ressource API Platform,
    # consommé par ApplyCommandProcessor. Vide tant qu'aucune ressource ne passe par
    # le bus de commande — mais garder une map vide, pas null : ApplyCommandProcessor
    # attend un array et le container ne compile pas sans ça.
    domain_resource_mapping:
        App\IAM\Domain\Model\User: App\IAM\Infrastructure\ApiPlatform\Resource\UserResource
        App\Catalog\Domain\Model\Product: App\Catalog\Infrastructure\ApiPlatform\Resource\ProductResource
