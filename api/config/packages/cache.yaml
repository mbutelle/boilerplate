framework:
    cache:
        # Namespace stable des clés : sans lui, deux déploiements de la même
        # application sur un Redis partagé se marchent dessus.
        prefix_seed: boilerplate/api

        # Le cache applicatif va dans Redis, pas sur le disque : en worker mode
        # comme derrière plusieurs répliques, un cache local à un conteneur est
        # incohérent d'une instance à l'autre.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        # Le cache système (métadonnées, annotations) reste local : il est dérivé
        # du code déployé, donc identique dans chaque conteneur, et le garder en
        # mémoire évite un aller-retour réseau sur le chemin chaud.
        system: cache.adapter.system
