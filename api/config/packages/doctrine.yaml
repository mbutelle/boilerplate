doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

        types:
            domain_id: App\Shared\Infrastructure\Doctrine\Type\DomainIdType
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        # Désactivé à cause de <gedmo:timestampable> : le XSD des doctrine-extensions
        # n'est pas résolvable hors ligne et le wildcard strict du schéma Doctrine
        # rejette l'élément. Le compromis est de perdre la validation des mappings ;
        # doctrine:schema:validate reste le filet.
        validate_xml_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            Shared:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/mapping/Shared'
                prefix: App\Shared\Domain
            IAM:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/mapping/IAM'
                prefix: App\IAM\Domain
            Catalog:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/mapping/Catalog'
                prefix: App\Catalog\Domain
            # L'entité RefreshToken vient du bundle gesdinet et garde son mapping
            # par attributs : ce n'est pas un modèle de domaine.
            IAMInfrastructure:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/IAM/Infrastructure/Security'
                prefix: App\IAM\Infrastructure\Security

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
