# Voir https://symfony.com/doc/current/bundles/StofDoctrineExtensionsBundle/index.html
stof_doctrine_extensions:
    default_locale: fr_FR
    orm:
        default:
            # Seul timestampable est activé : c'est le seul que le socle utilise
            # (trait Timestampable sur User et Product). Activer une extension
            # que rien n'emploie ajoute un écouteur sur chaque flush et laisse
            # croire qu'une fonctionnalité est en place. Repasser à true au
            # moment où le besoin apparaît réellement.
            timestampable: true
            translatable: false
            blameable: false
            softdeleteable: false
