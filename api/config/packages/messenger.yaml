framework:
    messenger:
        default_bus: 'command.bus'

        transports:
            # Transport Doctrine : la base est déjà là, aucune extension PHP ni
            # service supplémentaire à provisionner. auto_setup crée la table
            # messenger_messages au besoin.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

        # NE PAS router d'événement (event.bus) vers `async` : un événement de
        # domaine porte l'entité concernée, qui ne se sérialise pas. Les
        # événements restent synchrones, publiés après la transaction ; ce qui
        # part en asynchrone est un MESSAGE dédié ne transportant que des
        # scalaires — voir SendAccountCreatedEmail.
        routing:
            App\IAM\Infrastructure\Message\SendAccountCreatedEmail: async

        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Symfony\Messenger\Middleware\LockableCommandMiddleware
                    # Placé AVANT doctrine_transaction, donc plus à l'extérieur : les
                    # événements publiés depuis un handler de commande sont mis de côté
                    # et ne partent qu'une fois la transaction commitée. Sans lui, un
                    # abonné qui envoie un e-mail l'envoie pendant la transaction — et
                    # le mail est parti même si le commit échoue derrière.
                    - dispatch_after_current_bus
                    - doctrine_ping_connection
                    - doctrine_close_connection
                    - doctrine_transaction
                    - validation
            query.bus:
                middleware:
                    - validation
            event.bus:
                default_middleware: allow_no_handlers
                middleware:
                    - dispatch_after_current_bus
                    - validation
            message.bus:
                default_middleware: allow_no_handlers
                middleware:
                    - validation
